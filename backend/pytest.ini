[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    --cov=qflow_api
    --cov-report=term
    --cov-report=xml:coverage.xml
    --cov-fail-under=70

# coverage.py reads [coverage:*] sections from pytest.ini
[coverage:run]
source = qflow_api
branch = true
omit =
    */qflow_api/__init__.py
    */qflow_api/routers/__init__.py

[coverage:report]
fail_under = 70
show_missing = true
skip_empty = true

# Alias requested in docs / tooling that expects pyproject-style keys
[tool.coverage.report]
fail_under = 70
